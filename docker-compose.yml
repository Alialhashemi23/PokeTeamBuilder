services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-PokeDex!Passw0rd}
      MSSQL_PID: Express
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development # keeps Swagger available at http://localhost:5080/
      ConnectionStrings__DefaultConnection: >-
        Server=db;Database=PokedexDB;User Id=sa;
        Password=${SA_PASSWORD:-PokeDex!Passw0rd};
        TrustServerCertificate=true;Encrypt=false;
    ports:
      - "5080:8080" # Swagger / direct API access
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./pokedex-client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mssql-data:
